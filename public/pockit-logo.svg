<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Purse body -->
  <path
    d="M18 52 C14 38 18 26 28 20 C38 14 62 14 72 20 C82 26 86 38 82 52 C78 68 68 80 50 82 C32 80 22 68 18 52 Z"
    fill="#C98A2C"
    stroke="#1a1a1a"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  <!-- Clasp frame (arc) -->
  <path
    d="M28 32 Q35 18 50 16 Q65 18 72 32"
    stroke="#1a1a1a"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Clasp inner arc (silver bar) -->
  <path
    d="M33 30 Q40 20 50 18 Q60 20 67 30"
    stroke="#e8dcc8"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Left clasp knob -->
  <circle cx="28" cy="33" r="4" fill="#e8dcc8" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Right clasp knob -->
  <circle cx="72" cy="33" r="4" fill="#e8dcc8" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Clasp hinge ball (top center) -->
  <circle cx="50" cy="15" r="3.5" fill="#e8dcc8" stroke="#1a1a1a" stroke-width="2.5"/>
</svg>
